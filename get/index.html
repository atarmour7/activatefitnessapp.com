<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Activate Fitness — Kids Earn Screen Time by Moving</title>
<meta name="description" content="Kids earn their screen time by moving — daily steps or closing their Apple Watch Exercise Ring. Free on iPhone.">
<meta name="robots" content="noindex,follow">
<meta name="apple-itunes-app" content="app-id=6760926366">
<meta property="og:title" content="Activate Fitness — Move More. Earn More.">
<meta property="og:description" content="Kids earn their screen time by moving. Free on iPhone.">
<meta property="og:image" content="https://activatefitnessapp.com/images/logo.png">
<!-- Tab icon: transparent ring only (the square logo.png gets a white
     outline in Safari's dark tab bar). -->
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-ring.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Ad landing page for the Oct 2026 Meta video test.
     One screen, no scrolling. Visitors arrive from /get/?v=1, ?v=2 or ?v=3
     (one per video ad); the script at the bottom stamps the matching App
     Store campaign token (ct=fb_video1/2/3) onto the download button so
     App Store Connect can report downloads per video. No trackers, no cookies. */
  :root {
    --brand-red:   #E51A0F;
    --brand-orange:#E65C14;
    --brand-gold:  #FFBF00;
    --dark:        #0a0a0a;
    --white-70:    rgba(255,255,255,0.72);
    --white-45:    rgba(255,255,255,0.45);
    --white-10:    rgba(255,255,255,0.10);
    --white-06:    rgba(255,255,255,0.06);
    --grad:        linear-gradient(90deg, var(--brand-red), var(--brand-orange), var(--brand-gold));
    --font-display:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body:   'Barlow', -apple-system, 'Helvetica Neue', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: radial-gradient(120% 55% at 50% 0%, #2a1206 0%, var(--dark) 62%);
    background-color: var(--dark);
    color: #fff;
    font-family: var(--font-body);
    line-height: 1.35;
  }
  .wrap {
    min-height: 100vh; min-height: 100svh;
    max-width: 460px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 18px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: min(16px, 2.2svh);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-weight: 700;
    font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--white-70);
  }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .grad {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--brand-orange);
  }
  .hero {
    flex: 1; display: grid; grid-template-columns: 1fr 42%;
    gap: 12px; align-items: center;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: min(10.5vw, 6.4svh, 46px); line-height: 0.95;
    text-transform: uppercase;
  }
  .sub { font-size: 15px; color: var(--white-70); margin-top: 10px; }
  .shot {
    display: block; width: 100%; height: auto; max-height: 52svh; object-fit: contain;
    -webkit-mask-image: linear-gradient(#000 80%, transparent);
            mask-image: linear-gradient(#000 80%, transparent);
  }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step {
    background: var(--white-06); border: 1px solid var(--white-10);
    border-radius: 12px; padding: 10px 6px;
    text-align: center; font-size: 13px; line-height: 1.25; color: var(--white-70);
  }
  .step b {
    display: block; margin-bottom: 2px;
    font-family: var(--font-display); font-weight: 800; font-size: 17px;
    text-transform: uppercase; white-space: nowrap;
  }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; min-height: 56px; padding: 14px;
    border-radius: 15px; background: var(--grad);
    color: #fff; text-decoration: none;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(19px, 5.6vw, 22px); letter-spacing: 0.02em;
    white-space: nowrap; text-transform: uppercase;
    box-shadow: 0 10px 28px rgba(230, 92, 20, 0.35);
    -webkit-tap-highlight-color: transparent;
  }
  .cta:active { transform: scale(0.985); }
  .cta svg { width: 20px; height: 20px; flex: none; }
  .note { font-size: 13px; color: var(--white-45); text-align: center; margin-top: 8px; }
  .foot { font-size: 12px; color: var(--white-45); text-align: center; }
  .foot a { color: var(--white-70); }

  /* Short screens (small iPhones inside the Facebook/Instagram browser) */
  @media (max-height: 600px) {
    .sub { font-size: 14px; margin-top: 8px; }
    .step { padding: 7px 5px; font-size: 12px; }
    .step b { font-size: 15px; }
    .cta { min-height: 50px; padding: 12px; }
    .note { margin-top: 6px; font-size: 12px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="/images/logo.png" alt="" width="28" height="28">Activate Fitness</div>

  <div class="hero">
    <div>
      <h1>Kids earn <span class="grad">screen time</span> by moving.</h1>
      <p class="sub">No more nightly "five more minutes" fights.</p>
    </div>
    <img class="shot" src="/images/app-dashboard.jpg" alt="Activate Fitness home screen showing 20:00 of banked screen time and today's 1,454 steps" width="616" height="1220">
  </div>

  <div class="steps">
    <div class="step"><b class="grad">1. You pick</b>the apps that stay locked</div>
    <div class="step"><b class="grad">2. They move</b>steps or Apple Watch ring</div>
    <div class="step"><b class="grad">3. They earn</b>screen time to spend</div>
  </div>

  <div>
    <a class="cta js-store" href="https://apps.apple.com/app/apple-store/id6760926366?pt=118503335&amp;ct=fb_landing&amp;mt=8">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>
      Download free on iPhone
    </a>
    <p class="note">Free on the App Store · No ads · No subscription</p>
  </div>

  <p class="foot"><a href="/#legal">Privacy &amp; Terms</a></p>
</main>
<script>
  // Map ?v=1|2|3 (one per video ad) to its App Store campaign token.
  (function () {
    var v = new URLSearchParams(location.search).get('v');
    var tokens = { '1': 'fb_video1', '2': 'fb_video2', '3': 'fb_video3' };
    var ct = tokens[v];
    if (!ct) return; // no/unknown v: keep the fb_landing default
    var links = document.querySelectorAll('.js-store');
    for (var i = 0; i < links.length; i++) {
      links[i].href = 'https://apps.apple.com/app/apple-store/id6760926366?pt=118503335&ct=' + ct + '&mt=8';
    }
  })();
</script>
</body>
</html>
